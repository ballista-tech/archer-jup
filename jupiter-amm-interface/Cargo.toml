[package]
name = "jupiter-amm-interface"
version = "0.1.0"
edition = "2024"
description = "Jupiter AMM interface traits"

[dependencies]
solana-pubkey = "2.2.1"
solana-account = { version = "2.2.1", features = ["serde"] }
solana-clock = "2.2.1"
solana-instruction = "2.2.1"
solana-program-error = "2.2.1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ahash = "0.8"
