[package]
name = "archer-jup"
version = "0.1.0"
edition = "2024"
description = "Archer AMM integration for Jupiter aggregator"

[dependencies]
jupiter-amm-interface = { path = "jupiter-amm-interface" }
solana-pubkey = "2.2.1"
solana-program = "2.2.1"
solana-account = "2.2.1"
bytemuck = { version = "1.24", features = ["derive"] }
thiserror = "2"
rust_decimal = "1"
ahash = "0.8"
spl-token-2022 = { version = "6", features = ["no-entrypoint"] }

[dev-dependencies]
solana-client = "2.2.1"
solana-program-pack = "2.2.1"
solana-sysvar = "2.2.1"
solana-compute-budget = "2.2.1"
solana-transaction = "2.2.1"
solana-sdk = "2.2.1"
solana-account = "2.2.1"
tokio = { version = "1.38.0", features = ["full"] }
log = "0.4.28"
env_logger = "0.11.3"
spl-token = { version = "7", features = ["no-entrypoint"] }
spl-associated-token-account = "6"
litesvm = { version = "^0.6.1" }
rand = "0.9.2"
bincode = "1.3.3"
dotenvy = "0.15"
